name: iOS Build & Test

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cloud:
        description: "同时在 GitHub 云端 Mac 上跑一次（消耗付费分钟）"
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local:
    name: 本机 Mac 构建测试
    runs-on: [self-hosted, macOS, starsprout]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build & test
        run: ./scripts/build-and-test.sh

  cloud:
    name: 云端 Mac 构建测试
    if: github.event_name == 'workflow_dispatch' && inputs.cloud
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build & test
        run: ./scripts/build-and-test.sh
