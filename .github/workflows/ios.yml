name: iOS Build & Test

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Upload generated Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: StarSprout-xcodeproj
          path: StarSprout.xcodeproj
          retention-days: 7

      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          ios=[(k,v) for k,v in d.items() if 'iOS' in k]
          ios.sort(key=lambda kv: kv[0], reverse=True)
          for k,v in ios:
              for dev in v:
                  if dev['name'].startswith('iPhone'):
                      print(dev['udid']); sys.exit(0)
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $UDID"

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild test \
            -project StarSprout.xcodeproj \
            -scheme StarSprout \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | grep -E "error:|warning: .*(isolated|concurrency)|Test Case .*(passed|failed)|\*\* (BUILD|TEST)" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build.log

      - name: Show errors
        if: failure()
        run: grep -n -E "error:" build.log | sort -u | head -80 || true
