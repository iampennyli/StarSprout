name: StarSprout
options:
  bundleIdPrefix: li.penny
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 3R3Q558848
    CODE_SIGN_STYLE: Automatic
targets:
  StarSprout:
    type: application
    platform: iOS
    sources:
      - StarSprout
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: li.penny.starsprout
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 运动星球
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        ENABLE_PREVIEWS: YES
  StarSproutTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - StarSproutTests
    dependencies:
      - target: StarSprout
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: li.penny.starsprout.tests
schemes:
  StarSprout:
    build:
      targets:
        StarSprout: all
        StarSproutTests: [test]
    test:
      targets:
        - StarSproutTests
